<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxiFind — Intelligent Service Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='map-upgrades.css') }}">
</head>

<body>

    <!-- ── Navbar ── -->
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <a class="logo" href="#">
                <div class="logo-mark">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="10" r="4" stroke="currentColor" stroke-width="2" />
                        <path d="M12 2C7.03 2 3 6.03 3 11c0 6.25 9 13 9 13s9-6.75 9-13c0-4.97-4.03-9-9-9z"
                            stroke="currentColor" stroke-width="2" fill="none" />
                    </svg>
                </div>
                <span>Proxi<strong>Find</strong></span>
            </a>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="app-root">

        <!-- ── Hero ── -->
        <section class="hero">
            <div class="hero-inner">
                <h1 class="hero-title">
                    Find what's <em>near you,</em> instantly.
                </h1>
            </div>
        </section>

        <!-- ── Search Panel ── -->
        <section class="search-panel">
            <div class="search-card">
                <div class="search-row">
                    <div class="field field--main">
                        <label>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                                <circle cx="12" cy="10" r="3" />
                            </svg>
                            Location
                        </label>
                        <input type="text" id="place" placeholder="City, neighborhood, landmark…" autocomplete="off">
                        <div id="suggestions"></div>
                    </div>
                    <div class="field field--category">
                        <label>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                            Category
                        </label>
                        <div class="select-wrap">
                            <select id="category">
                                <option value="All">All Services</option>
                                <option value="restaurant">🍽 Dining</option>
                                <option value="hospital">🏥 Health</option>
                                <option value="atm">💳 Finance</option>
                                <option value="gym">💪 Fitness</option>
                                <option value="pharmacy">💊 Pharmacy</option>
                                <option value="school">🎓 Education</option>
                                <option value="cafe">☕ Café</option>
                                <option value="bank">🏦 Banking</option>
                            </select>
                            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9" />
                            </svg>
                        </div>
                    </div>
                    <div class="field field--radius">
                        <label>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 8v4l3 3" />
                            </svg>
                            Radius
                        </label>
                        <div class="radius-input">
                            <input type="number" id="radius" value="2" min="1" max="20">
                            <span class="unit-tag">km</span>
                        </div>
                    </div>
                </div>
                <div class="search-actions">
                    <button onclick="search()" class="btn-search" id="search-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        Search
                    </button>
                    <button onclick="getLocation()" class="btn-gps">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="3" />
                            <path d="M12 1v3M12 20v3M1 12h3M20 12h3" />
                            <path d="M12 5a7 7 0 1 0 7 7" />
                        </svg>
                        Use GPS
                    </button>
                </div>
            </div>
        </section>

        <!-- ── Map + Results ── -->
        <section class="workspace">
            <div class="map-pane">
                <div id="map"></div>
                <div class="map-badge">© OpenStreetMap</div>
            </div>
            <div class="results-pane" id="results-pane">
                <div class="results-head" id="results-header">
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.5">
                                <circle cx="11" cy="11" r="8" />
                                <path d="M21 21l-4.35-4.35" />
                            </svg>
                        </div>
                        <p>Search to explore nearby services</p>
                    </div>
                </div>
                <div id="results-list"></div>
            </div>
        </section>

    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loader-card">
            <div class="spinner"></div>
            <p id="loader-text">Searching nearby…</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
